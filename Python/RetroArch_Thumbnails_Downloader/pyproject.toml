[project]
name = "retroarch-thumbnails-downloader"
version = "2.0.1"
description = "Descargador de thumbnails para RetroArch (PyQt5)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "PyQt5>=5.15,<6",
    "requests>=2.28,<3",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=5.0",
    "setuptools>=65",
    "wheel>=0.38",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = [
    ".",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "PTH",
    "ARG",
    "RUF",
]
ignore = [
    "E501",
]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
overrides = [
    { module = "PyQt5.*", ignore_missing_imports = true },
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-q"

[tool.coverage.run]
source = [
    "core",
]
branch = true

[tool.setuptools]
py-modules = [
    "main",
]

[tool.setuptools.packages.find]
include = [
    "core*",
    "ui*",
]

[tool.setuptools.data-files]
data = [
    "data/*.json",
]
locales = [
    "locales/*.json",
]
icons = [
    "icons/retro-thumbnails.png",
    "icons/retro-thumbnails.ico",
]

[tool.appimage-builder.project]
name = "RetroArch_Thumbnails_Downloader"
version = "2.0.1"
description = "Descargador de thumbnails para RetroArch (PyQt5)"
author = "Handerson"
license = "MIT"
build_type = "python"
entry_point = "main:main"
python_version = "3.14"
icon = "/run/media/handerson/0CD2ACE7D2ACD66C/Carreras/Programacion/GitHub/Proyectos_De_Software/Python/RetroArch_Thumbnails_Downloader/icons/retro-thumbnails.png"

[tool.appimage-builder.build]
excluded_libraries = ["libpq.so.5", "libodbc.so.2", "libodbcinst.so.2", "libclntsh.so.23.1", "libmysqlclient.so.21", "libmariadb.so.3", "libmimerapi.so", "libfbclient.so.2", "libQt53DAnimation.so.5", "libQt53DCore.so.5", "libQt53DExtras.so.5", "libQt53DInput.so.5", "libQt53DLogic.so.5", "libQt53DRender.so.5", "libQt53DQuick.so.5", "libQt53DQuickAnimation.so.5", "libQt53DQuickExtras.so.5", "libQt53DQuickInput.so.5", "libQt53DQuickRender.so.5", "libQt53DQuickScene2D.so.5", "libQt5Gamepad.so.5", "libQt5Bodymovin.so.5", "libQt5Pdf.so.5", "libQt5PdfWidgets.so.5", "libQt5WebEngine.so.5", "libQt5WebEngineCore.so.5"]
output = "/run/media/handerson/0CD2ACE7D2ACD66C/Carreras/Programacion/GitHub/Proyectos_De_Software/Python/RetroArch_Thumbnails_Downloader/dist"
architecture = "x86_64"
compression = "xz"

[tool.appimage-builder.runtime]
cache_dir = "/home/handerson/.cache/appimage-builder"

[build-system]
requires = [
    "setuptools>=65",
]
build-backend = "setuptools.build_meta"
