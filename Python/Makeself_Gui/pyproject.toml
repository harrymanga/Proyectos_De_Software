[project]
name = "makeself-gui"
version = "0.5.4"
description = "GUI multiplataforma (PySide6/Qt) para crear, inspeccionar y recrear archivos Makeself"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
