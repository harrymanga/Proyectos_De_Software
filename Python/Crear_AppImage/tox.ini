[tox]
env_list = py311, py312, lint
isolated_build = true

[testenv]
description = Unit + integration + GUI tests (network needed for slow tests)
deps =
    pytest>=8.2.0
    pytest-asyncio>=0.23.0
    pytest-cov>=5.0.0
    pytest-qt>=4.2.0
    pytest-mock>=3.14.0
    typer[all]>=0.12.0
    rich>=13.7.0
    pydantic>=2.7.0
    pydantic-settings>=2.3.0
    httpx>=0.27.0
    anyio>=4.3.0
    platformdirs>=4.2.0
    python-dotenv>=1.0.0
    tomli-w>=1.0.0
    packaging>=24.0
    filelock>=3.15.0
    PySide6-Essentials>=6.7.0
commands =
    python -m pytest tests/ -m "not slow" -q
setenv =
    QT_QPA_PLATFORM = offscreen
    PYTHONPATH = {toxinidir}/src

[testenv:slow]
description = Full suite including network-dependent tests
commands =
    {[testenv]commands}
    python -m pytest tests/ -m "slow" -q
setenv =
    {[testenv]setenv}

[testenv:lint]
description = Ruff check + format check
skip_install = true
deps = ruff>=0.5.0
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:typing]
description = Mypy strict (ratchet: reducir errores hasta 0)
deps =
    mypy>=1.10.0
    typer[all]>=0.12.0
    rich>=13.7.0
    pydantic>=2.7.0
    pydantic-settings>=2.3.0
    httpx>=0.27.0
    anyio>=4.3.0
    platformdirs>=4.2.0
    python-dotenv>=1.0.0
    tomli-w>=1.0.0
    packaging>=24.0
    filelock>=3.15.0
    PySide6-Essentials>=6.7.0
commands =
    mypy -p appimage_builder
setenv =
    MYPYPATH = {toxinidir}/src
    PYTHONPATH = {toxinidir}/src

[testenv:cov]
description = Coverage ratchet (>=60%, subir hacia 80%)
deps =
    {[testenv]deps}
commands =
    python -m pytest tests/ -m "not slow" -q --cov --cov-report=term --cov-fail-under=60
setenv =
    QT_QPA_PLATFORM = offscreen
    PYTHONPATH = {toxinidir}/src
