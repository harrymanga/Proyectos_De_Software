[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appimage-builder"
version = "0.1.0"
description = "Automatización de creación de paquetes AppImage con CLI y GUI intuitiva"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Handerson", email = "handerson@example.com"}
]
keywords = ["appimage", "packaging", "linux", "deployment", "gui", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    # CLI Framework
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    # Config & Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Async & HTTP
    "httpx>=0.27.0",
    "anyio>=4.3.0",
    # Filesystem & Paths
    "platformdirs>=4.2.0",
    # GUI Framework
    "PySide6>=6.7.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tomli-w>=1.0.0",
    "packaging>=24.0",
    "filelock>=3.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-qt>=4.2.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "black>=24.3.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "tox>=4.15.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-autorefs>=1.0.0",
]
gui = [
    "pygments>=2.17.0",  # Syntax highlighting para logs
]
build = [
    # pyside6-uic, pyside6-rcc (solo donde hay release; en 3.14+ no existe)
    "pyside6-tools>=6.7.0; python_version<'3.14'",
]

[project.scripts]
appimage-builder = "appimage_builder.__main__:main"
appimage-builder-gui = "appimage_builder.gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["appimage_builder*"]

[tool.setuptools.package-data]
"*" = [
    "gui/resources/*",
    "gui/ui/**/*",
    "gui/styles/*",
    "gui/styles/icons/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "gui: GUI tests (require display)",
    "slow: Slow tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "htmlcov",
    "site",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "PTH", # flake8-use-pathlib
    "ARG", # flake8-unused-arguments
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function call in default argument
    "ARG001", # unused argument (common in callbacks)
    "ARG002", # unused argument (common in callbacks)
    "UP042", # keep str+Enum (explicit .value; Typer/pydantic compat)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001", "ARG002", "ARG005"]
"src/appimage_builder/gui/ui/*" = ["ALL"]
"src/appimage_builder/gui/**/*.py" = ["N802"]  # Qt overrides: initializePage, dropEvent…

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
  | \.eggs
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | htmlcov
  | site
)/
'''

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
module = [
    "PySide6.*",
    "pytest*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/appimage_builder"]
omit = [
    "*/tests/*",
    "*/gui/ui/*",
    "*/__main__.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true

[tool.pydantic-mypy]
init_forbid_extra = "warn"

[tool.pyright]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
reportUnknownArgumentType = false

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "$version"

[tool.towncrier]
package = "appimage_builder"
package_dir = "src/appimage_builder"
filename = "CHANGELOG.md"
directory = "changes"
template = ".towncrier_template.rst"
underlines = ["=", "-", "~"]

[tool.pre-commit.hooks]
# Se define en .pre-commit-config.yaml