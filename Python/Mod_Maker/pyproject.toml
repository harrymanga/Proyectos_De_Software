[project]
name = "Mod_Maker"
version = "0.1.0"
description = "Herramienta multiplataforma para crear, editar y gestionar mods de Factorio"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.12.0",
    "toml==0.10.2",
    "Pillow>=10.0.0",
    "rich>=15.0.0",
    "pyfiglet>=1.0.0",
    "questionary>=2.1.0",
    "colorama>=0.4.6",
]

[project.scripts]
factorio-mod-maker = "src.gui.main_window:main"
mod-maker = "src.cli.mod_cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["EXE002", "BLE001"]

[tool.mypy]
python_version = "3.11"
strict = true
