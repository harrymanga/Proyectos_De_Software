[project]
name = "cheatengine-mcp-bridge"
version = "12.0.0"
description = "Bridge MCP para Cheat Engine (pipe Windows + relay TCP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.0.0,<2",
]
requires-dist = [
  "pywin32>=306; sys_platform=='win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "PTH", "ARG", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
[[tool.mypy.overrides]]
module = ["mcp.*", "win32file", "pywintypes"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["MCP_Server/tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
